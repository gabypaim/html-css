<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Queen';
            src: url(fonts/Reikna.ttf) format('truetype');
        }

        /* Tipos de format ()
        -opentype (otf)
        -truetype (ttf)
        -embedded-opentype 
        -truetype-aat (apple advanced typography)
        -svg
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            width: 400px;
            margin: auto;
        }

        h1 {
            font-family: 'Queen';
            font-size: 4em;
        }
    </style>
</head>
<body>
    <h1>NEWJEANS</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque maiores, fugiat voluptate tempora repellat, aliquid dolores, commodi ducimus fuga dolor corrupti ab distinctio atque quaerat nam quo voluptatem impedit! Quaerat?</p>
</body>
</html>
