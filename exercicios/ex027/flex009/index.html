<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightcoral;

            
            display: flex;
            flex-flow: row wrap;
            
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: auto;
            

            
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">Conteúdo maior</div>
        <div class="item">mais espaço</div>
        <div class="item">E</div>
        <div class="item">Maior para ocupar espaço testanto flex-basis</div>
        <div class="item">G</div>
    </div>
</body>
</html>
