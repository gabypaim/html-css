<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border-width: 5px;
            border-style: solid;
            border-color: blueviolet;
             
            padding-top: 20px;
            padding-right: 10px;
            padding-bottom: 20px;
            padding-left: 10px;

            margin-top: 100px;
            margin-right: 200px;
            margin-bottom: 100px;
            margin-left: 100px;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: blue;
        }

        a {
            background-color: lightblue;
            border-style: solid;
            border-width: 10px;

            padding-top: 20px;
            padding-right: 10px;
            padding-bottom: 20px;
            padding-left: 10px;

            margin: auto;
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level </h1>
    <p>Parágrafos também são exemplos de box-leval, mas os <a href="#">Links são exemplos de caixas inline-level!</a> vamos ver como funciona!</p>
</body>
</html>
