<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 10px solid rgb(157, 72, 236);
             
            padding: 10px 10px 15px 10px;
            /* paddin: 10px 20px = 10 para cima e baixo e 20 para direita e  esquerda*/

            margin: 100px auto 150px auto;

            outline: 5px dashed red;
        }

        a {
            display: block;
            background-color: lightblue;
            border-style: solid;
            border-width: 10px;

            padding-top: 20px;
            padding-right: 10px;
            padding-bottom: 20px;
            padding-left: 10px;

            margin: auto;
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level </h1>
    <p>Parágrafos também são exemplos de box-leval, mas os <a href="#">Links são exemplos de caixas inline-level!</a> vamos ver como funciona!</p>
</body>
</html>
