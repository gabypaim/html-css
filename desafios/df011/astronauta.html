<!DOCTYPE html>

<head>

    <title>Espaço</title>
    <style>
        body {
            background-color: blueviolet;
            margin: auto;

        #container {
            position: relative;
            background-image: url('imagens/espaco.jpg');

            transform: translate(-50% , -50%);

    <section id="container">
        <article id="astro"></article>
    </section>
